<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MemoDeck - Flashcards Intelligentes</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: 'var(--primary)',
                    }
                }
            }
        }
    </script>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --primary: #3B82F6;
            --bg-color: #F3F4F6;
        }
        .dark {
            --bg-color: #111827;
        }
        body {
            background-color: var(--bg-color);
            transition: background-color 0.3s;
        }
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
        .preserve-3d { transform-style: preserve-3d; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- 1. CONFIGURATION ET INITIALISATION FIREBASE ---
        const firebaseConfig = {
            apiKey: "AIzaSyC2IfwOo9wEYgjq11WxTcxOSxNKUoLY8Wc",
            authDomain: "memodeck-2ac00.firebaseapp.com",
            projectId: "memodeck-2ac00",
            storageBucket: "memodeck-2ac00.firebasestorage.app",
            messagingSenderId: "1073357840018",
            appId: "1:1073357840018:web:d20cddbdcc98b56458104b",
            measurementId: "G-QBLMVGBTY3"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        const { useState, useEffect, useRef } = React;

        // --- ICONES ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const icons = {
                Brain: <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96.44 2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58 2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96.44 2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58 2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/>,
                Plus: <path d="M5 12h14M12 5v14"/>,
                Trash2: <path d="M3 6h18M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2M10 11v6M14 11v6"/>,
                Edit2: <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>,
                Play: <polygon points="5 3 19 12 5 21 5 3"/>,
                LogOut: <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>,
                Moon: <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>,
                Sun: <><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></>,
                Folder: <path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.93a2 2 0 0 1-1.66-.9l-.82-1.2A2 2 0 0 0 7.93 2H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/>,
                ChevronRight: <path d="m9 18 6-6-6-6"/>,
                ChevronDown: <path d="m6 9 6 6 6-6"/>,
                Star: <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>,
                Zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>,
                ArrowLeft: <path d="M19 12H5M12 19l-7-7 7-7"/>,
                Save: <><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></>
            };
            return (
                <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
                    {icons[name] || <circle cx="12" cy="12" r="10" />}
                </svg>
            );
        };

        const generateId = () => Math.random().toString(36).substr(2, 9);

        // --- COMPOSANTS UI ---
        const Button = ({ children, onClick, variant = 'primary', className = '', disabled=false }) => {
            const baseStyle = "px-4 py-2 rounded-lg font-medium transition-all duration-200 flex items-center justify-center gap-2 transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed";
            const variants = {
                primary: "bg-blue-600 text-white hover:bg-blue-700 shadow-lg",
                secondary: "bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-white hover:bg-gray-300",
                ghost: "bg-transparent text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800",
                success: "bg-green-500 text-white hover:bg-green-600"
            };
            return <button disabled={disabled} className={`${baseStyle} ${variants[variant]} ${className}`} onClick={onClick}>{children}</button>;
        };

        // --- APPLICATION ---
        function MemoDeckApp() {
            const [user, setUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [view, setView] = useState('login'); 
            const [decks, setDecks] = useState([]);
            const [currentDeck, setCurrentDeck] = useState(null);
            const [darkMode, setDarkMode] = useState(false);
            const [notif, setNotif] = useState(null);

            const showNotif = (msg) => { setNotif(msg); setTimeout(() => setNotif(null), 3000); };

            // Auth Listener
            useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (u) => {
                    if (u) {
                        setUser(u);
                        await loadDecks(u.uid);
                        setView('lobby');
                    } else {
                        setUser(null);
                        setView('login');
                    }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            const loadDecks = async (uid) => {
                try {
                    const snap = await db.collection("decks").where("ownerId", "==", uid).get();
                    const list = [];
                    snap.forEach(doc => list.push({ id: doc.id, ...doc.data() }));
                    setDecks(list);
                } catch (e) { console.error(e); }
            };

            const handleGoogleLogin = async () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                try {
                    await auth.signInWithPopup(provider);
                } catch (e) { showNotif("Échec de connexion Google"); }
            };

            const handleGuestLogin = async () => {
                try {
                    await auth.signInAnonymously();
                } catch (e) { showNotif("Échec connexion invité"); }
            };

            const createDeck = async () => {
                const newDeck = {
                    title: "Nouveau Deck",
                    ownerId: user.uid,
                    rootCategory: { id: generateId(), name: "Racine", subCategories: [], cards: [] }
                };
                const doc = await db.collection("decks").add(newDeck);
                setDecks([...decks, { ...newDeck, id: doc.id }]);
                setCurrentDeck({ ...newDeck, id: doc.id });
                setView('editor');
            };

            if (loading) return (
                <div className="min-h-screen flex items-center justify-center bg-gray-50 dark:bg-gray-900">
                    <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                </div>
            );

            if (view === 'login') return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-gray-50 dark:bg-gray-900">
                    <div className="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl max-w-sm w-full text-center">
                        <Icon name="Brain" size={60} className="mx-auto text-blue-600 mb-4" />
                        <h1 className="text-3xl font-bold mb-6 dark:text-white">MemoDeck</h1>
                        <div className="space-y-4">
                            <Button onClick={handleGoogleLogin} variant="primary" className="w-full">Se connecter avec Google</Button>
                            <Button onClick={handleGuestLogin} variant="secondary" className="w-full">Continuer en Invité</Button>
                        </div>
                    </div>
                </div>
            );

            return (
                <div className={darkMode ? 'dark' : ''}>
                    <div className="min-h-screen bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white">
                        {/* Header */}
                        <header className="p-4 bg-white dark:bg-gray-800 shadow-sm flex justify-between items-center">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('lobby')}>
                                <Icon name="Brain" className="text-blue-600" />
                                <span className="font-bold text-xl">MemoDeck</span>
                            </div>
                            <div className="flex items-center gap-3">
                                <button onClick={() => setDarkMode(!darkMode)} className="p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700">
                                    {darkMode ? <Icon name="Sun" /> : <Icon name="Moon" />}
                                </button>
                                <button onClick={() => auth.signOut()} className="p-2 text-red-500"><Icon name="LogOut" /></button>
                            </div>
                        </header>

                        <main className="max-w-4xl mx-auto p-6">
                            {view === 'lobby' && (
                                <div className="space-y-6">
                                    <div className="flex justify-between items-center">
                                        <h2 className="text-2xl font-bold">Mes Decks</h2>
                                        <Button onClick={createDeck}><Icon name="Plus" /> Créer</Button>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        {decks.map(d => (
                                            <div key={d.id} className="bg-white dark:bg-gray-800 p-6 rounded-xl shadow-md border border-gray-100 dark:border-gray-700 flex justify-between items-center">
                                                <div>
                                                    <h3 className="font-bold text-lg">{d.title}</h3>
                                                    <p className="text-sm text-gray-500">Prêt pour révision</p>
                                                </div>
                                                <div className="flex gap-2">
                                                    <Button onClick={() => { setCurrentDeck(d); setView('editor'); }} variant="secondary"><Icon name="Edit2" size={16} /></Button>
                                                    <Button onClick={() => showNotif("Jeu bientôt dispo")}><Icon name="Play" size={16} /></Button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {view === 'editor' && currentDeck && (
                                <div className="space-y-6">
                                    <div className="flex items-center gap-4">
                                        <button onClick={() => setView('lobby')}><Icon name="ArrowLeft" /></button>
                                        <input 
                                            className="bg-transparent text-2xl font-bold outline-none border-b border-transparent focus:border-blue-500"
                                            value={currentDeck.title}
                                            onChange={(e) => setCurrentDeck({...currentDeck, title: e.target.value})}
                                        />
                                        <Button onClick={async () => {
                                            await db.collection("decks").doc(currentDeck.id).update(currentDeck);
                                            showNotif("Enregistré !");
                                        }} variant="success"><Icon name="Save" size={16} /> Enregistrer</Button>
                                    </div>
                                    <div className="bg-white dark:bg-gray-800 p-8 rounded-xl text-center border-2 border-dashed border-gray-200 dark:border-gray-700">
                                        <p>L'éditeur complet se charge ici...</p>
                                        <Button className="mt-4" onClick={() => {
                                            const q = prompt("Question ?");
                                            const r = prompt("Réponse ?");
                                            if(q && r) {
                                                const newDeck = {...currentDeck};
                                                newDeck.rootCategory.cards.push({ id: generateId(), question: q, answer: r });
                                                setCurrentDeck(newDeck);
                                            }
                                        }}>Ajouter une carte test</Button>
                                        <div className="mt-4 text-left">
                                            {currentDeck.rootCategory.cards.map(c => (
                                                <div key={c.id} className="p-2 border-b dark:border-gray-700">{c.question} -> {c.answer}</div>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                            )}
                        </main>

                        {notif && (
                            <div className="fixed bottom-6 right-6 bg-blue-600 text-white px-6 py-3 rounded-full shadow-2xl animate-bounce">
                                {notif}
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MemoDeckApp />);
    </script>
</body>
</html>
